# Applies supabase/migrations to the hosted Supabase project by running the same
# script used locally.
#
# One-time setup (Settings → Secrets and variables → Actions):
#   Secret    SUPABASE_ACCESS_TOKEN – dashboard → account avatar → Access tokens
#   Variable  SUPABASE_PROJECT_REF  – the ref in the dashboard URL, so you don't
#                                     have to type it on every run (optional)
#   Secret    SUPABASE_DB_PASSWORD  – only for CLI versions that still ask for
#                                     the Postgres password (optional)
name: Deploy Supabase migrations

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref (defaults to the SUPABASE_PROJECT_REF variable)
        required: false
        type: string

permissions:
  contents: read

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The CLI reads SUPABASE_ACCESS_TOKEN from the environment, so no
      # `supabase login` (and no credential store) is needed here.
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref || vars.SUPABASE_PROJECT_REF }}
        run: pwsh -NoProfile ./scripts/publish-supabase.ps1
